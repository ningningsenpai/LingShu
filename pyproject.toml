[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lingshu-gateway"
version = "0.1.0"
description = "供 Codex 调用的本地多模型 Gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dashboard = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
]
dev = [
  "pytest>=9.0.3,<10",
  "pyright>=1.1,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
lingshu = "lingshu.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lingshu = ["dashboard/static/*", "dashboard/static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
typeCheckingMode = "basic"
